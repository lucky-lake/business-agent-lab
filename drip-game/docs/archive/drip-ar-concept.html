<title>드립 AR 바리스타</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #110D0A;
    --ink: #F2E9DD;
    --ink-2: #B9AA98;
    --line: rgba(242, 233, 221, .16);
    --ar: #6FE7FF;
    --clay: #E8957A;
  }
  html, body { background: var(--ground); }
  body {
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding-inline: 16px;
    padding-block: 24px 40px;
  }
  .wrap { max-width: 1200px; margin-inline: auto; display: grid; gap: 16px; }
  header { display: grid; gap: 6px; }
  .eyebrow { margin: 0; font: 500 12px/1.2 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .08em; color: var(--clay); }
  h1 { margin: 0; font-family: "Gowun Batang", "Nanum Myeongjo", serif; font-weight: 700; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.15; text-wrap: balance; }
  .sub { margin: 0; max-width: 62ch; color: var(--ink-2); }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1200 / 760; border-radius: 14px; overflow: hidden; background: #0C0907; box-shadow: 0 0 0 1px var(--line); }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; }
  .group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .label { font-size: 12px; color: var(--ink-2); letter-spacing: .04em; }
  .seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); }
  button { font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  button:hover { background: rgba(242, 233, 221, .08); }
  button:focus-visible { outline: 2px solid var(--ar); outline-offset: 2px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .btn { box-shadow: inset 0 0 0 1px var(--line); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; box-shadow: inset 0 0 0 1px var(--line); }
  .toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); }
  .toggle[aria-pressed="true"] { color: var(--ar); box-shadow: inset 0 0 0 1px rgba(111, 231, 255, .55); }
  .toggle[aria-pressed="true"] .dot { background: var(--ar); box-shadow: 0 0 8px var(--ar); }
  .note { margin: 0; font-size: 13px; color: var(--ink-2); }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">PROJECT 1 · 컨셉 목업</p>
    <h1>드립 AR 바리스타</h1>
    <p class="sub">현실에 가깝게 그린 드립 장면 위에 Claude 바리스타 코치가 AR로 겹쳐 보여요. 붓기 방식을 바꾸면 커피 베드 균일도와 예상 맛이 달라져요.</p>
  </header>

  <div class="stage">
    <canvas id="scene" role="img" aria-label="세라믹 드리퍼에 주전자로 물을 붓는 드립커피 장면. 커피 베드 위에 균일도 격자가 투영되고, 도트 캐릭터 Claude가 옆에서 코칭한다."></canvas>
  </div>

  <div class="controls">
    <div class="group">
      <span class="label">붓기 방식</span>
      <div class="seg" id="pattern">
        <button type="button" id="p-spiral" data-p="spiral" aria-pressed="true">나선형</button>
        <button type="button" id="p-center" data-p="center" aria-pressed="false">중앙 집중</button>
        <button type="button" id="p-edge" data-p="edge" aria-pressed="false">가장자리</button>
      </div>
    </div>
    <div class="group">
      <span class="label">속도</span>
      <div class="seg" id="speed">
        <button type="button" id="s-1" data-s="1" aria-pressed="false">실제</button>
        <button type="button" id="s-4" data-s="4" aria-pressed="true">4×</button>
        <button type="button" id="s-8" data-s="8" aria-pressed="false">8×</button>
      </div>
    </div>
    <div class="group">
      <button type="button" class="btn" id="play">일시정지</button>
      <button type="button" class="btn" id="restart">처음부터</button>
    </div>
    <button type="button" class="toggle" id="ar" aria-pressed="true"><span class="dot"></span>AR 레이어</button>
  </div>

  <p class="note">컨셉 목업이라 추출 물리와 숫자는 예시 값이에요. 실제 프로젝트에서는 이 모델을 단계별로 만들고 검증해요.</p>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const cv = $('#scene'), ctx = cv.getContext('2d');
  const W = 1200, H = 760, CX = 630, AR = '#6FE7FF', DOSE = 15, N = 13;
  const FK = '"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  const FM = '"IBM Plex Mono",ui-monospace,Menlo,monospace';
  const POURS = [{ s: 0, e: 10, to: 30 }, { s: 40, e: 62, to: 140 }, { s: 80, e: 102, to: 250 }];
  const PRESET = { spiral: { ey: 19.8, tds: 1.30 }, center: { ey: 22.6, tds: 1.38 }, edge: { ey: 17.3, tds: 1.12 } };
  const STEPS = [['뜸', ['bloomPour', 'bloomWait']], ['1차', ['pour1', 'wait1']], ['2차', ['pour2']], ['드로다운', ['drawdown']], ['완성', ['done']]];
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const fmt = t => { t = Math.max(0, t); return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); };
  function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const R = rng(42);

  /* ---------- simulation ---------- */
  const cellUV = [], mask = new Uint8Array(N * N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const u = -1 + (i + .5) * 2 / N, v = -1 + (j + .5) * 2 / N;
    cellUV.push([u, v]); mask[j * N + i] = u * u + v * v <= 1.1 ? 1 : 0;
  }
  let S, ripples, bubbles, steam, drops;
  function reset() {
    S = { t: 0, poured: 0, absorbed: 0, L: 0, dripped: 0, outRate: 0, maxL: 0, cells: new Float32Array(N * N), by: { spiral: 0, center: 0, edge: 0 }, trail: [], done: false };
    ripples = []; bubbles = []; steam = []; drops = [];
  }
  function pourRate(t) { let prev = 0; for (const p of POURS) { if (t >= p.s && t < p.e) return (p.to - prev) / (p.e - p.s); prev = p.to; } return 0; }
  function pourUV(p, t) {
    let r, th;
    if (p === 'spiral') { r = .14 + .6 * (.5 - .5 * Math.cos(t * 2 * Math.PI / 18)); th = t * 2 * Math.PI / 5; }
    else if (p === 'center') { r = .1 + .05 * Math.sin(t * 1.7); th = t * 2 * Math.PI / 4; }
    else { r = .9 + .04 * Math.sin(t * 1.3); th = t * 2 * Math.PI / 6; }
    return [r * Math.cos(th), r * Math.sin(th), r];
  }
  const bloomAmt = t => t < 10 ? t / 10 * .6 : t < 45 ? .6 : Math.max(0, .6 - (t - 45) / 40 * .6);
  function deposit(u, v, r, amt) {
    const sg = .38, eff = r > .82 ? .45 : 1, w = new Float32Array(N * N); let sum = 0;
    for (let k = 0; k < N * N; k++) { if (!mask[k]) continue; const du = cellUV[k][0] - u, dv = cellUV[k][1] - v; w[k] = Math.exp(-(du * du + dv * dv) / (2 * sg * sg)); sum += w[k]; }
    for (let k = 0; k < N * N; k++) if (mask[k]) S.cells[k] += amt * eff * w[k] / sum;
  }
  function diffuse(d) {
    const c = S.cells, n = new Float32Array(c), k = Math.min(1, .25 * d);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const id = j * N + i; if (!mask[id]) continue; let s = 0, m = 0;
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const a = i + di, b = j + dj; if (a < 0 || b < 0 || a >= N || b >= N) continue;
        const id2 = b * N + a; if (!mask[id2]) continue; s += c[id2]; m++;
      }
      if (m) n[id] = c[id] + (s / m - c[id]) * k;
    }
    S.cells = n;
  }
  function step(d) {
    const q = pourRate(S.t);
    if (q > 0) {
      const [u, v, r] = pourUV(pattern, S.t), amt = Math.min(q * d, 250 - S.poured);
      if (amt > 0) {
        S.poured += amt; S.by[pattern] += amt; let toBed = amt;
        if (S.absorbed < DOSE * 2) { const a = Math.min(DOSE * 2 - S.absorbed, amt * .6); S.absorbed += a; toBed -= a; }
        S.L += toBed; deposit(u, v, r, amt);
      }
      S.trail.push({ u, v, t: S.t }); if (S.trail.length > 90) S.trail.shift();
    }
    let out = 0;
    if (S.L > 0) { out = Math.min(S.L, (.06 * S.L + .15) * d); S.L -= out; S.dripped += out; }
    S.outRate = out / d; S.maxL = Math.max(S.maxL, S.L); diffuse(d); S.t += d;
    if (!S.done && S.t > 102 && S.L < .3) { S.done = true; S.L = 0; S.outRate = 0; }
  }
  function stats() {
    let s = 0, s2 = 0, m = 0, inn = 0, ni = 0, out = 0, no = 0;
    for (let k = 0; k < N * N; k++) {
      if (!mask[k]) continue; const x = S.cells[k]; s += x; s2 += x * x; m++;
      const r = Math.hypot(cellUV[k][0], cellUV[k][1]);
      if (r < .45) { inn += x; ni++; } else if (r > .7) { out += x; no++; }
    }
    const mean = s / m, sd = Math.sqrt(Math.max(0, s2 / m - mean * mean));
    const uni = mean > 0 ? clamp(1 - sd / mean, 0, 1) : 0, ri = inn / ni, ro = out / no;
    let zone = '고르게 젖는 중';
    if (mean > 0) { if (ro < ri * .8) zone = '가장자리가 덜 젖었어요'; else if (ri < ro * .8) zone = '가운데가 덜 젖었어요'; }
    return { mean, uni, zone };
  }
  function estimate() {
    const tot = S.by.spiral + S.by.center + S.by.edge; let ey = 20, tds = 1.26;
    if (tot > 0) { ey = 0; tds = 0; for (const p in S.by) { ey += PRESET[p].ey * S.by[p] / tot; tds += PRESET[p].tds * S.by[p] / tot; } }
    const prog = S.done ? 1 : Math.min(1, S.t / 165), e = 1 - Math.pow(1 - prog, 2);
    return { ey: lerp(20, ey, e), tds: lerp(1.26, tds, e), unc: 1 - e };
  }
  function taste(ey, tds, uni) {
    const a = [];
    if (tds < 1.15) a.push('연함'); else if (tds > 1.35) a.push('진함');
    if (ey < 18) a.push('시큼'); else if (ey > 22) a.push('쓴맛');
    let txt = a.length ? a.join(' · ') : '밸런스 · 단맛 좋음';
    if (uni > 0 && uni < .65) txt += ' · 흐릿함';
    return { txt, good: !a.length && (uni === 0 || uni >= .65) };
  }
  function phase(t) {
    if (S.done) return 'done'; if (t < 10) return 'bloomPour'; if (t < 40) return 'bloomWait';
    if (t < 62) return 'pour1'; if (t < 80) return 'wait1'; if (t < 102) return 'pour2'; return 'drawdown';
  }
  const endEstimate = () => S.L <= .3 ? S.t : S.t + Math.log((S.L + 2.5) / 2.8) / .06;
  function tipFor() {
    const b = S.by;
    if (b.center >= b.edge && b.center > b.spiral * .5) return '다음엔 원을 더 넓게 그려봐요.';
    if (b.edge > b.spiral * .5) return '다음엔 벽을 피해 안쪽에 부어봐요.';
    return '다음엔 붓는 위치를 고르게 나눠봐요.';
  }
  function coach(ph, st, est) {
    const P = {
      spiral: '좋아요! 나선을 그리며 고르게 붓고 있어요.',
      center: '가운데만 깊게 파이고 있어요. 원을 조금 넓혀볼까요?',
      edge: '벽에 닿은 물은 가루를 거치지 않고 흘러내려요. 안쪽을 노려봐요.'
    };
    if (ph === 'bloomPour') return '뜸 들이기 30 g이에요. 가루 전체가 젖도록 살살 부어주세요.';
    if (ph === 'bloomWait') return '가스가 빠지면서 거품이 부풀어 오르죠? 0:40까지 기다려요.';
    if (ph === 'pour1' || ph === 'pour2') return P[pattern];
    if (ph === 'wait1') return '잠깐 쉬어요. 물 높이가 내려가면 1:20에 2차 붓기예요.';
    if (ph === 'drawdown') return '이제 물이 다 빠지길 기다리면 돼요. ' + fmt(endEstimate()) + '쯤 끝날 것 같아요.';
    const t = taste(est.ey, est.tds, st.uni);
    return t.good ? '완성! 밸런스 좋은 한 잔이에요. 단맛이 잘 살아 있을 거예요.' : '완성… ' + t.txt + ' 쪽일 것 같아요. ' + tipFor();
  }

  /* ---------- static assets ---------- */
  function makeTex(base, cols, seed, n) {
    const c = document.createElement('canvas'); c.width = 512; c.height = 160;
    const g = c.getContext('2d'), r = rng(seed);
    if (base) { g.fillStyle = base; g.fillRect(0, 0, 512, 160); }
    for (let i = 0; i < n; i++) {
      g.fillStyle = cols[(r() * cols.length) | 0]; g.globalAlpha = .5 + r() * .5;
      g.beginPath(); g.arc(r() * 512, r() * 160, .6 + r() * 1.8, 0, 7); g.fill();
    }
    return c;
  }
  const texDry = makeTex('#8A6142', ['#5E3C22', '#A57A55', '#6F4A2C', '#B98C62', '#4A2E19'], 7, 9000);
  const texWet = makeTex('#3A2213', ['#24130A', '#4E2E18', '#5E391E', '#1A0D06', '#6B4426'], 11, 9000);
  const texFoam = makeTex(null, ['#C89B6A', '#D9B489', '#A87A4E', '#E3C49C'], 19, 5000);

  function rrPath(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  const BG = (() => {
    const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2;
    const g = c.getContext('2d'); g.scale(2, 2); const r = rng(3);
    let gr = g.createLinearGradient(0, 0, 0, 600); gr.addColorStop(0, '#1A1411'); gr.addColorStop(1, '#241A14');
    g.fillStyle = gr; g.fillRect(0, 0, W, 600);
    let rg = g.createRadialGradient(330, 40, 10, 330, 40, 720);
    rg.addColorStop(0, 'rgba(255,196,130,.22)'); rg.addColorStop(.5, 'rgba(255,170,100,.06)'); rg.addColorStop(1, 'rgba(255,170,100,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
    rg = g.createRadialGradient(630, 330, 20, 630, 330, 380);
    rg.addColorStop(0, 'rgba(255,210,160,.07)'); rg.addColorStop(1, 'rgba(255,210,160,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, 600);
    for (let i = 0; i < 14; i++) {
      const x = r() * W, y = 40 + r() * 460, rad = 14 + r() * 46, a = .03 + r() * .06;
      const b = g.createRadialGradient(x, y, 0, x, y, rad);
      b.addColorStop(0, `rgba(255,${190 + r() * 40 | 0},${120 + r() * 60 | 0},${a})`);
      b.addColorStop(.8, `rgba(255,200,140,${a * .7})`); b.addColorStop(1, 'rgba(255,200,140,0)');
      g.fillStyle = b; g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill();
    }
    gr = g.createLinearGradient(0, 600, 0, 700); gr.addColorStop(0, '#2A1B11'); gr.addColorStop(1, '#4B301D');
    g.fillStyle = gr; g.fillRect(0, 600, W, 100);
    for (let i = 0; i < 70; i++) {
      const t = i / 70, y0 = 600 + Math.pow(t, 1.3) * 100;
      g.strokeStyle = r() < .5 ? `rgba(20,10,4,${.18 + r() * .2})` : `rgba(140,95,60,${.06 + r() * .08})`;
      g.lineWidth = .5 + t * 1.4; g.beginPath();
      const ph = r() * 6, amp = .4 + t * 2.2, fr = .004 + r() * .006;
      for (let x = 0; x <= W; x += 20) { const y = y0 + Math.sin(x * fr + ph) * amp; x ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke();
    }
    rg = g.createRadialGradient(380, 650, 5, 380, 650, 300);
    rg.addColorStop(0, 'rgba(255,200,140,.12)'); rg.addColorStop(1, 'rgba(255,200,140,0)');
    g.fillStyle = rg; g.fillRect(0, 600, W, 100);
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 598, W, 4);
    gr = g.createLinearGradient(0, 700, 0, H); gr.addColorStop(0, '#24160D'); gr.addColorStop(1, '#120B07');
    g.fillStyle = gr; g.fillRect(0, 700, W, 60);
    g.fillStyle = 'rgba(210,160,110,.28)'; g.fillRect(0, 699, W, 1.5);
    // scale
    g.save(); g.translate(630, 664); g.scale(1, .1);
    const sh = g.createRadialGradient(0, 0, 0, 0, 0, 260); sh.addColorStop(0, 'rgba(0,0,0,.65)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sh; g.beginPath(); g.arc(0, 0, 260, 0, 7); g.fill(); g.restore();
    let sg = g.createLinearGradient(0, 606, 0, 628); sg.addColorStop(0, '#2E2E31'); sg.addColorStop(1, '#1D1D1F');
    g.fillStyle = sg; g.beginPath(); g.moveTo(482, 606); g.lineTo(778, 606); g.lineTo(796, 628); g.lineTo(464, 628); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.10)'; g.lineWidth = 1; g.beginPath(); g.moveTo(482, 606.5); g.lineTo(778, 606.5); g.stroke();
    sg = g.createLinearGradient(0, 628, 0, 660); sg.addColorStop(0, '#18181A'); sg.addColorStop(1, '#0C0C0D');
    g.fillStyle = sg; rrPath(g, 464, 628, 332, 32, 6); g.fill();
    g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(464, 628, 332, 1);
    g.fillStyle = '#060706'; g.fillRect(486, 635, 124, 18); g.fillRect(682, 635, 92, 18);
    g.strokeStyle = 'rgba(255,255,255,.06)'; g.strokeRect(486.5, 635.5, 123, 17); g.strokeRect(682.5, 635.5, 91, 17);
    for (const bx of [636, 656]) { g.fillStyle = '#232326'; g.beginPath(); g.arc(bx, 644, 5, 0, 7); g.fill(); g.strokeStyle = 'rgba(255,255,255,.1)'; g.stroke(); }
    return c;
  })();

  const PAL = { B: '#3A2A22', b: '#24180F', O: '#D97757', E: '#1B110C', P: '#F2A48C', M: '#7A2E1A', A: '#F2E6D2', a: '#D6C3A5', c: '#6B3E1E', K: '#2A140C' };
  const SPRITE = [
    '....BBBBBB....', '..BBBBBBBBBB..', '.bbbbbbbbbbbb.', 'OOOOOOOOOOOOOO',
    'OOOOOOOOOOOOOO', 'OOOEEOOOOEEOOO', 'OOOEEOOOOEEOOO', 'OPPOOOOOOOOPPO',
    'OOOOOOMMOOOOOO', '.OOOOOOOOOOOO.', '..AAAAAAAAAA..', 'OOAAAAAAAAAAOO',
    'OOAAAAAcAAAAOO', '..AAAAAAAAAA..', '..AaaaaaaaaA..', '...OO....OO...'
  ];
  function buildSprite(rows, px) {
    const h = rows.length, w = rows[0].length, G = [];
    for (let y = 0; y < h + 2; y++) { G.push([]); for (let x = 0; x < w + 2; x++) { const r = rows[y - 1], ch = r ? r[x - 1] : undefined; G[y].push(ch && ch !== '.' ? ch : null); } }
    const out = G.map(r => r.slice());
    for (let y = 0; y < h + 2; y++) for (let x = 0; x < w + 2; x++) {
      if (G[y][x]) continue;

    glow(); ctx.strokeStyle = AR; ctx.lineWidth = 1.5; ctx.setLineDash([10, 7]); ctx.lineDashOffset = RM ? 0 : -tn * 24;

  const bub = { key: null, at: -1e3 };
  function drawBubble(tn, st, est, head) {

  function bedCallout(s, st) {

  function kettleCallout(th) {

  }
  function serverCallout() {

  }
  function chartHUD(est, st) {
    const x = 904, y = 412, w = 268, h = 240; panel(x, y, w, h);

    txt('진함', (X0 + X1) / 2, Y0 + 14, zf, zc, 'center'); txt('연함', (X0 + X1) / 2, Y1 - 6, zf, zc, 'center');

  function drawAR(tn, s, st, est, th) {

  /* ---------- loop ---------- */
  let pattern = 'spiral', speed = 4, playing = !RM, arOn = true, kp = 1, last = performance.now();
  let ripT = 0, bubT = 0, stT = 0, dropT = 0, restartAt = 0;
  function update(dt) {
